<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Projekt-Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
    }
    svg {
      width: 100%;
      height: 600px;
    }
    .node rect {
      fill: white;
      stroke: #999;
      stroke-width: 2px;
      rx: 10;
      ry: 10;
    }
    .node text {
      pointer-events: none;
      font-size: 14px;
    }
    .checkbox {
      pointer-events: all;
      transform: scale(1.5);
    }
    .link {
      fill: none;
      stroke: #666;
      stroke-width: 2px;
      marker-end: url(#arrow);
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">🗺️ Projekt-Roadmap</h1>
  <svg></svg>

  <script>
    const nodes = [
      { id: "portfolio", name: "Portfolio-Website", checked: true },
      { id: "blog", name: "Blog mit Markdown", checked: false },
      { id: "spring", name: "Spring Boot API", checked: false }
    ];

    const links = [
      { source: "portfolio", target: "blog" },
      { source: "portfolio", target: "spring" }
    ];

    const svg = d3.select("svg");
    const width = window.innerWidth;
    const height = 600;

    svg.attr("width", width).attr("height", height);

    svg.append("defs").append("marker")
      .attr("id", "arrow")
      .attr("viewBox", "0 -5 10 10")
      .attr("refX", 25)
      .attr("refY", 0)
      .attr("markerWidth", 6)
      .attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M0,-5L10,0L0,5")
      .attr("fill", "#666");

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(150))
      .force("charge", d3.forceManyBody().strength(-500))
      .force("center", d3.forceCenter(width / 2, height / 2));

    const link = svg.append("g")
      .selectAll("line")
      .data(links)
      .join("line")
      .attr("class", "link");

    const node = svg.append("g")
      .selectAll("g")
      .data(nodes)
      .join("g")
      .attr("class", "node")
      .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended));

    node.append("rect")
      .attr("width", 180)
      .attr("height", 50)
      .attr("x", -90)
      .attr("y", -25);

    node.append("foreignObject")
      .attr("x", -85)
      .attr("y", -15)
      .attr("width", 170)
      .attr("height", 40)
      .append("xhtml:div")
      .html(d => `
        <label style="display: flex; align-items: center;">
          <input type="checkbox" class="checkbox" ${d.checked ? "checked" : ""}/>
          <span style="margin-left: 0.5em;">${d.name}</span>
        </label>
      `);

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node
        .attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }
  </script>
</body>
</html>
